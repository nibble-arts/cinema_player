[player]
master = screen1
screensaver = 
enable_screensaver = True

[screens]
screen1 = {'position': '0:0', 'crop': '1920:1080:0:0'}

# Saallicht ueber DMX.
# output: enttec = DMX512 an einem Enttec DMX USB Pro (nicht Open DMX)
#         artnet = DMX ueber das Netzwerk (UDP 6454)
# Kanaele, die hier nicht stehen, werden als 0 gesendet.
# Dieses Universum sollte nur das Saallicht enthalten.
[lights]
enabled = True
output = enttec
device = /dev/ttyUSB0
host = 255.255.255.255
port = 6454
universe = 0
fade = 2
play = 1:0
stop = 1:255

